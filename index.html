<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Eco-Friendly System</title>
  <!-- Load Roboflow Web Browser SDK -->
  <script src="https://cdn.roboflow.com/0.2.26/roboflow.js"></script>
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      box-sizing: border-box;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 1.5rem;
      text-align: center;
    }

    p {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 0.9rem;
      color: #94a3b8;
      text-align: center;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 640px;
      aspect-ratio: 4 / 3;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      background: #1e293b;
    }

    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <h1>AI Eco-Friendly Detector</h1>
  <p>Plants glow Yellow | Plastic & Paper glow Pink</p>

  <div class="video-wrapper">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');

    // 1. Initialize Webcam Stream
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }
        });
        video.srcObject = stream;
        return new Promise((resolve) => {
          video.onloadedmetadata = () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            resolve();
          };
        });
      } catch (err) {
        alert("Webcam access error: " + err.message);
      }
    }

    // 2. Load Roboflow Model and Process Frames
    async function initDetector() {
      await startCamera();

      // Replace these placeholders with your actual Roboflow details
      roboflow
        .auth({ apiKey: "YOUR_ROBOFLOW_API_KEY" })
        .load({ model: "YOUR_MODEL_ID", version: "1" })
        .then((model) => {
          detectLoop(model);
        });
    }

    // 3. Inference & Canvas Glow Rendering
    async function detectLoop(model) {
      const predictions = await model.detect(video);

      // Clear the canvas each frame
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      predictions.forEach((pred) => {
        const { x, y, width, height, class: label } = pred;
        const normalizedLabel = label.toLowerCase();

        ctx.save();

        // Color Logic: Plants = Yellow (#FFFF00) | Plastic/Paper = Pink (#FF69B4)
        if (normalizedLabel.includes('plant')) {
          ctx.strokeStyle = '#FFFF00';
          ctx.fillStyle = 'rgba(255, 255, 0, 0.25)';
          ctx.shadowColor = '#FFFF00';
        } else if (normalizedLabel.includes('plastic') || normalizedLabel.includes('paper')) {
          ctx.strokeStyle = '#FF69B4';
          ctx.fillStyle = 'rgba(255, 105, 180, 0.25)';
          ctx.shadowColor = '#FF69B4';
        } else {
          ctx.strokeStyle = '#00FFFF';
          ctx.fillStyle = 'rgba(0, 255, 255, 0.2)';
          ctx.shadowColor = '#00FFFF';
        }

        // Apply visual glow intensity
        ctx.shadowBlur = 25;
        ctx.lineWidth = 4;

        // Draw bounding box with rounded edges
        ctx.beginPath();
        ctx.roundRect(x - width / 2, y - height / 2, width, height, 8);
        ctx.fill();
        ctx.stroke();

        // Render object text label
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 16px sans-serif';
        ctx.fillText(label.toUpperCase(), x - width / 2 + 6, y - height / 2 + 22);

        ctx.restore();
      });

      // Continuous loop call
      requestAnimationFrame(() => detectLoop(model));
    }

    initDetector();
  </script>
</body>
</html>
